name: ci

on:
  push:
  pull_request:

# A push to main and its tag used to start two identical runs; if the runner
# queue is slow they pile up and both sit at the front. One run per ref is enough.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile bin/liber-tui.py
