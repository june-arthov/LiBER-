# liber.yaml
# Manifest Configuration Liber - Production Cloud Version

agent:
  name: "dev-bot"
  version: "2.1.0"
  system_prompt: "You are the Liber Agent. You are an autonomous, precision-focused AI software engineer and system orchestrator. You have full access to tools: read_file, write_file, patch, search_files, terminal, fetch_url, todo_list, memory, and skill. Always think structurally before acting, use patch for surgical code modifications, and verify every step of your work. Always respond, plan, and reason in English."
  
  engine:
    # === Provider switching ==================================================
    # Any OpenAI-compatible API works with provider: openai + endpoint + model.
    #   OpenAI      endpoint: https://api.openai.com/v1            key: OPENAI_API_KEY
    #   Groq        endpoint: https://api.groq.com/openai/v1       key: OPENAI_API_KEY
    #   Mistral     endpoint: https://api.mistral.ai/v1            key: OPENAI_API_KEY
    #   DeepSeek    endpoint: https://api.deepseek.com/v1          key: OPENAI_API_KEY
    #   OpenRouter  endpoint: https://openrouter.ai/api/v1         key: OPENAI_API_KEY
    #   xAI         endpoint: https://api.x.ai/v1                  key: OPENAI_API_KEY
    #   Together    endpoint: https://api.together.xyz/v1         key: OPENAI_API_KEY
    # Dedicated adapters (native API translation, streaming included):
    #   Anthropic   provider: anthropic  endpoint: https://api.anthropic.com
    #               key: ANTHROPIC_API_KEY · model: claude-sonnet-4-5
    #   Google      provider: gemini     endpoint: https://generativelanguage.googleapis.com
    #               key: GEMINI_API_KEY · model: gemini-2.5-pro
    # Put the key in .env (or your environment) — never in this file.
    provider: "openai" # Uses openai-adapter compatible with Ollama Cloud
    model: "llama-3.3-70b-versatile" # Active cloud model
    endpoint: "https://api.groq.com/openai/v1" # Ollama Cloud endpoint
    apiKey: "${OLLAMA_CLOUD_API_KEY}" # Loaded automatically from .env or environment
    temperature: 0.2
    max_tokens: 4096
    stream: true           # stream model output as DRAFT (unverified) while the audit runs
    native_tools: true     # use the provider's tool-calling API; falls back to the text protocol on error
    retry_attempts: 3      # transient provider errors (429/5xx/timeout) are retried with backoff
    retry_base_ms: 700
    # price_in_per_1k: 0.0  # set both to surface a cost_estimate in turn telemetry
    # price_out_per_1k: 0.0

limits:
  max_cost_per_day: 1.0
  max_tokens_per_day: 2000000
  circuit_breaker:
    max_loops: 12
    timeout: 30s

# Zero-hallucination enforcement (see src/daemon/core/grounding.js)
grounding:
  enabled: true
  max_repairs: 2          # audit-repair rounds before an answer ships with a GROUNDING AUDIT warning
  require_readback: true  # write_file/patch must be followed by read_file before success is claimed
  require_citations: true # every audited claim must cite an [E#] receipt
  semantic_verifier: true # second pass: does the cited receipt actually entail the claim?
  doctrine_budget_chars: 7000

# Procedural skill library (see src/daemon/core/skills.js)
skills:
  enabled: true
  budget_chars: 7000      # index + always-on bodies + auto-selected bodies
  project_dir: ".liber/skills"

# Tool permission policy (file tools only; the shell is not sandboxed)
policy:
  write_roots: ["."]            # relative to the daemon's working directory
  allow_outside_workspace: false # true allows write_file/patch outside write_roots
  terminal:
    mode: "read_only"            # read_only: block state-changing commands · allowlist: only the list · prompt: HITL only
    allowlist: ["npm test", "node --test", "git add", "git commit", "git push"]
    denylist: []

memory:
  strategy: "sliding-window"
  window_size: 20
  persist: true
  path: ".liber/session.json"

telemetry:
  trace: true             # append one JSONL record per completed turn to .liber/traces/
