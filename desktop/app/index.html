<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiBER</title>
<style>
  :root{
    --bg:#0d0e10; --panel:#141519; --panel2:#1a1c21; --panel3:#202329;
    --border:#232630; --border-strong:#30343f;
    --text:#dfe3ea; --muted:#8b93a3; --dim:#5a6172;
    --accent:#39c5f0; --green:#2fd07a; --amber:#f2b544; --red:#f0616d; --violet:#a78bfa;
    --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    --sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --sidebar:256px; --overview:318px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column}

  /* ── title bar ─────────────────────────────── */
  .titlebar{height:35px;min-height:35px;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{font-weight:700;letter-spacing:.05em;margin-right:8px;font-size:13px}
  .brand b{color:var(--accent)}
  .menubtn{font-size:12px;color:var(--muted);padding:0 10px;height:28px;display:inline-flex;align-items:center;border-radius:5px;cursor:pointer;background:none;border:none;font-family:inherit}
  .menubtn:hover{background:var(--panel2);color:var(--text)}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border-strong);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .pill.online .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
  .pill.busy .dot{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .grow{flex:1}
  .iconbtn{width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
  .iconbtn:hover{background:var(--panel2);color:var(--text);border-color:var(--border-strong)}

  /* ── layout ────────────────────────────────── */
  .shell{flex:1;display:flex;min-height:0}

  /* sidebar */
  .sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .sidebar.collapsed{display:none}
  .sidebar-scroll{flex:1;overflow-y:auto;padding:8px}
  .newchat{width:100%;display:flex;align-items:center;gap:8px;padding:4px 8px;height:32px;border-radius:8px;background:var(--panel3);border:1px solid var(--border-strong);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .newchat:hover{border-color:var(--accent);color:var(--accent)}
  .sideitem{width:100%;display:flex;align-items:center;gap:8px;padding:4px 8px;height:32px;border-radius:6px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-align:left;font-family:inherit}
  .sideitem:hover{background:var(--panel2);color:var(--text)}
  .sideitem.disabled{opacity:.45;cursor:not-allowed}
  .sect{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:14px 4px 6px}
  .sect button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px}
  .proj{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:5px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;background:none;border:none;width:100%;text-align:left}
  .proj:hover{background:var(--panel2)}
  .conv{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 30px;height:32px;border-radius:5px;font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit}
  .conv:hover{background:var(--panel2);color:var(--text)}
  .conv.active{background:var(--panel3);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
  .conv .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .ago{font-size:10px;color:var(--dim);font-family:var(--mono)}
  .sidebar-foot{border-top:1px solid var(--border);padding:6px}

  /* conversation */
  .convwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .convhead{height:36px;min-height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--panel)}
  .crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
  .crumb b{color:var(--text);font-weight:600}
  .crumb .sep{color:var(--dim)}
  .stream{flex:1;overflow-y:auto;padding:16px 24px 8px;display:flex;flex-direction:column;gap:14px}
  .turn{max-width:768px;width:100%;margin:0 auto}
  .userrow{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .ububble{background:var(--panel3);border:1px solid var(--border-strong);border-radius:11px;padding:6px 10px;max-width:78%;white-space:pre-wrap;word-break:break-word;line-height:1.55}
  .uactions{display:flex;gap:6px;opacity:0;transition:.12s}
  .userrow:hover .uactions{opacity:1}
  .tinybtn{background:none;border:1px solid var(--border-strong);color:var(--dim);border-radius:5px;padding:1px 7px;font-size:10px;cursor:pointer;font-family:inherit}
  .tinybtn:hover{color:var(--text);border-color:var(--accent)}
  .step{border:1px solid var(--border);border-radius:8px;background:var(--panel);margin:6px 0;overflow:hidden}
  .step>summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);user-select:none}
  .step>summary::-webkit-details-marker{display:none}
  .step .tag{font-family:var(--mono);font-size:10px;color:var(--accent);background:#0d2b33;border-radius:4px;padding:1px 5px}
  .step .ok{color:var(--green)} .step .bad{color:var(--red)}
  .step pre{margin:0;padding:8px 10px;border-top:1px solid var(--border);background:#0a0b0d;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
  .answer{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:10px 12px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .answer code{font-family:var(--mono);font-size:12px;background:#1b1f27;border-radius:4px;padding:1px 5px;color:#9ecbff}
  .answer pre{background:#0a0b0d;border:1px solid var(--border);border-radius:6px;padding:10px;overflow:auto;margin:8px 0}
  .answer pre code{background:none;padding:0;color:var(--text)}
  .answer table{border-collapse:collapse;margin:8px 0;font-size:12px}
  .answer th,.answer td{border:1px solid var(--border-strong);padding:4px 8px}
  .cite{color:var(--accent);font-family:var(--mono);font-size:11px;background:#0d2b33;border-radius:4px;padding:0 4px}
  .audit{border:1px solid var(--green);border-left:3px solid var(--green);background:#0c1a12;color:var(--green);border-radius:6px;padding:7px 10px;font-size:12px;white-space:pre-wrap;margin-top:8px}
  .audit.warn{border-color:var(--amber);border-left-color:var(--amber);background:#1a1409;color:var(--amber)}
  .worked{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);cursor:pointer;user-select:none;padding:2px 0}
  .worked:hover{color:var(--muted)}
  .card{border:1px solid var(--border-strong);border-radius:8px;background:var(--panel);margin:8px 0;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12px;background:var(--panel2);border-bottom:1px solid var(--border)}
  .card-h .stat{font-family:var(--mono);font-size:11px;color:var(--green)}
  .card-h .stat .del{color:var(--red)}
  .card-b{max-height:180px;overflow:auto;font-family:var(--mono);font-size:11.5px}
  .frow{display:flex;gap:8px;padding:4px 11px;border-bottom:1px solid #17191e;color:var(--muted)}
  .frow .st{width:14px;color:var(--amber)}
  .frow .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .a{color:var(--green)} .frow .d{color:var(--red)}
  .empty{margin:auto;text-align:center;color:var(--dim);padding:40px}
  .empty .big{font-size:20px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}

  /* composer */
  .composer{padding:10px 22px 14px;border-top:1px solid var(--border);background:var(--bg)}
  .cbox{max-width:768px;margin:0 auto;border:1px solid var(--border-strong);border-radius:16px;background:var(--panel);overflow:hidden}
  .cbox:focus-within{border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);background:var(--panel3);border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;color:var(--muted)}
  .chip b{color:var(--accent);font-weight:600}
  .chip .x{cursor:pointer;color:var(--dim)}
  .chip .x:hover{color:var(--red)}
  #prompt{width:100%;resize:none;background:none;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;line-height:1.5;padding:10px 12px;max-height:180px;min-height:40px}
  .crow{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
  .cbtn{display:inline-flex;align-items:center;gap:6px;height:28px;font-size:12px;background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cbtn:hover{background:var(--panel2);color:var(--text);border-color:var(--border-strong)}
  .cbtn .cv{color:var(--text)}
  .send{width:28px;height:28px;border-radius:50%;border:none;background:var(--accent);color:#04222c;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
  .send:disabled{background:var(--panel3);color:var(--dim);cursor:not-allowed}
  .cmeta{display:flex;align-items:center;gap:10px;padding:0 10px 8px;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
  .cmeta .br{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
  .cmeta .br b{color:var(--accent);font-weight:500}

  /* popovers */
  .pop{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;box-shadow:0 16px 44px rgba(0,0,0,.6);padding:6px;min-width:230px;display:none}
  .pop.open{display:block}
  .pop .ph{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 8px 4px}
  .pop .pi{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
  .pop .pi:hover,.pop .pi.sel{background:var(--panel2)}
  .pop .pi .nm{color:var(--text)}
  .pop .pi .ds{font-size:11px;color:var(--dim);line-height:1.4}
  .pop .pi .r{display:flex;justify-content:space-between;gap:8px}
  .pop .pi .tag{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .pop .sep{height:1px;background:var(--border);margin:5px 4px}

  /* overview rail */
  .overview{width:var(--overview);min-width:var(--overview);border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .overview.hidden{display:none}
  .ov-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .ov-scroll{flex:1;overflow-y:auto;padding:8px}
  .ovrow{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:6px 10px;border-radius:7px;background:none;border:1px solid transparent;color:var(--muted);font-size:12px;cursor:pointer;text-align:left;font-family:inherit}
  .ovrow:hover{background:var(--panel2);color:var(--text)}
  .ovrow.active{background:var(--panel3);border-color:var(--border-strong);color:var(--text)}
  .ovrow .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel3);border-radius:9px;padding:0 6px;color:var(--muted)}
  .ovbody{display:none;padding:4px 6px 10px}
  .ovbody.open{display:block}
  .act{padding:6px 8px;border-left:2px solid var(--border-strong);margin:4px 0 4px 6px;font-size:11px;color:var(--muted)}
  .act.ok{border-left-color:var(--green)} .act.bad{border-left-color:var(--red)}
  .act .t{font-family:var(--mono);color:var(--text);font-size:11px}
  .act .d{color:var(--dim);font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .skill{padding:5px 8px;font-size:11px;color:var(--muted);border-radius:5px}
  .skill b{color:var(--text);font-weight:600;font-size:11.5px}
  .skill .ds{color:var(--dim);font-size:10.5px;line-height:1.35}

  /* settings drawer (kept) */
  .drawer-overlay{position:fixed;inset:0;background:rgba(4,5,7,.55);display:none;z-index:400}
  .drawer-overlay.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:620px;background:var(--panel);border-left:1px solid var(--border-strong);box-shadow:-24px 0 60px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .16s ease;display:flex;flex-direction:column;z-index:401}
  .drawer-overlay.open .drawer{transform:none}
  .drawer-h{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);font-size:12px;letter-spacing:.12em;font-weight:700}
  .drawer-s{padding:10px 12px;border-bottom:1px solid var(--border)}
  .drawer-s input{width:100%;background:var(--panel2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 11px;color:var(--text);font-size:12px;outline:none;font-family:inherit}
  .drawer-s input:focus{border-color:var(--accent)}
  .crumbbar{display:flex;gap:6px;padding:8px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .drawer-body{flex:1;display:flex;min-height:0}
  .dnav{width:186px;min-width:186px;border-right:1px solid var(--border);background:var(--bg);overflow-y:auto;padding:8px 4px}
  .dgroup-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-radius:5px}
  .dgroup-h:hover{background:var(--panel2);color:var(--muted)}
  .ditem{padding:5px 10px 5px 22px;font-size:12px;color:var(--muted);border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ditem:hover{background:var(--panel2);color:var(--text)}
  .ditem.active{background:var(--accent);color:#04222c;font-weight:600}
  .dpanel{flex:1;overflow-y:auto;padding:16px 20px 26px}
  .dpanel h3{font-size:13px;margin-bottom:4px}
  .dpanel .pd{color:var(--muted);font-size:12px;margin-bottom:14px;line-height:1.5}
  .dsec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
  .f{display:flex;gap:12px;margin:9px 0;align-items:flex-start}
  .f label{width:150px;min-width:150px;font-size:12px;color:var(--muted);margin-top:3px}
  .f .c{flex:1;min-width:0}
  .f input[type=text],.f input[type=number],.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;font-family:var(--mono);outline:none}
  .f textarea{min-height:56px;resize:vertical;line-height:1.5}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
  .f .hint{color:var(--dim);font-size:11px;margin-top:3px}
  .f input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin-top:3px}
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:4px}
  .tab{padding:6px 13px;font-size:12px;color:var(--muted);border-radius:6px 6px 0 0;cursor:pointer;background:none;border:1px solid transparent;border-bottom:none;font-family:inherit}
  .tab:hover{background:var(--panel2);color:var(--text)}
  .tab.active{background:var(--panel);border-color:var(--border);color:var(--text)}
  .btn{border-radius:7px;padding:8px 15px;font-size:12px;font-weight:600;border:1px solid var(--border-strong);background:var(--panel2);color:var(--text);cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#04222c;border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw.sel{border-color:var(--text)}
  table.tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border)}
  .tbl td{padding:6px 8px;border-bottom:1px solid #17191e}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<div class="titlebar">
  <span class="brand">Li<b>BER</b></span>
  <button class="menubtn" data-menu="file">File</button>
  <button class="menubtn" data-menu="workspace">Workspace</button>
  <button class="menubtn" data-menu="view">View</button>
  <button class="menubtn" data-menu="window">Window</button>
  <span class="grow"></span>
  <span class="pill" id="pill-state"><span class="dot"></span><span id="state-text">CONNECTING</span></span>
  <span class="pill" id="pill-model"><span class="dot"></span><span id="model-text">—</span></span>
  <span class="pill" id="pill-perms" title="Agent permission preset"><span class="dot"></span><span id="perms-text">—</span></span>
  <span class="grow"></span>
  <button class="iconbtn" id="sidebar-toggle" title="Toggle sidebar (Ctrl+B)">◧</button>
  <button class="iconbtn" id="overview-toggle" title="Toggle overview (Ctrl+Alt+O)">▤</button>
  <button class="iconbtn" id="gear-btn" title="Settings (Ctrl+,)">⚙</button>
</div>

<div class="shell">
  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll">
      <button class="newchat" id="new-conv"><span>＋</span> New Conversation</button>
      <div style="height:6px"></div>
      <button class="sideitem" id="nav-skills"><span>◆</span> Skills <span class="grow"></span><span id="skill-count" style="font-family:var(--mono);font-size:10px;color:var(--dim)"></span></button>
      <button class="sideitem" id="nav-automations" title="Scheduled automations are not implemented in this build"><span>◷</span> Automations</button>
      <div class="sect"><span>Projects</span><span id="branch-mini"></span></div>
      <div id="project-list"></div>
    </div>
    <div class="sidebar-foot">
      <button class="sideitem" id="nav-settings"><span>⚙</span> Settings</button>
    </div>
  </aside>

  <!-- conversation -->
  <section class="convwrap">
    <div class="convhead">
      <div class="crumb" id="crumb"><span>dev-bot</span><span class="sep">/</span><b>New conversation</b></div>
      <span class="grow"></span>
      <button class="tinybtn" id="nav-prev" title="Previous turn">↑</button>
      <button class="tinybtn" id="nav-next" title="Next turn">↓</button>
      <button class="tinybtn" id="btn-compact" title="Compact history (/compact)">compact</button>
      <button class="tinybtn" id="btn-review" title="Show changed files">review</button>
    </div>

    <div class="stream" id="stream">
      <div class="empty" id="empty-state">
        <div class="big">LiBER</div>
        <div>Machine-enforced grounding. Ask anything, <b>@</b> to mention, <b>/</b> for actions.</div>
      </div>
    </div>

    <div class="composer">
      <div class="cbox">
        <div class="chips" id="chips"></div>
        <textarea id="prompt" rows="1" placeholder="Ask anything, @ to mention, / for actions"></textarea>
        <div class="crow">
          <button class="cbtn" id="btn-context" title="Add context (@)">＋</button>
          <button class="cbtn" id="btn-model" title="Select model (Ctrl+/)">⚡ <span class="cv" id="model-label">—</span></button>
          <button class="cbtn" id="btn-perms" title="Agent permissions">🛡 <span class="cv" id="perms-label">—</span></button>
          <span class="grow"></span>
          <button class="cbtn" disabled title="Voice input is not implemented in this build">🎙</button>
          <button class="send" id="send-btn" title="Send (Enter)">↑</button>
        </div>
        <div class="cmeta">
          <span class="br">⌂ Local Checkout</span>
          <span class="br">⑂ <b id="branch-label">—</b></span>
          <span class="grow"></span>
          <span id="foot-status"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- overview rail -->
  <aside class="overview" id="overview">

/* ── token bootstrap ─────────────────────────── */
async function loadToken(){
  let tokenPath=null;
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);
    const r=await fetch(DAEMON+'/whoami',{signal:c.signal});clearTimeout(t);
    if(r.ok){const j=await r.json();tokenPath=j.token_path||null;cwd=j.cwd||'';}
  }catch{}
  if(window.Neutralino){
    try{
      Neutralino.init();
      await Promise.race([
        new Promise(res=>{ if(Neutralino.events&&Neutralino.events.on) Neutralino.events.on('ready',res); else res(); }),
        new Promise(res=>setTimeout(res,4000))
      ]);
      try{const e=String(await Neutralino.os.getEnv('LIBER_TOKEN')||'').trim(); if(e){token=e;return;}}catch{}
      if(tokenPath){const raw=await Neutralino.filesystem.readFile(tokenPath);token=String(raw).trim();}
    }catch{}
  }
}
const authHeaders=x=>token?{...x,Authorization:'Bearer '+token}:x;
async function api(route,method='GET',body=null){
  const r=await fetch(DAEMON+route,{method,headers:authHeaders({'Content-Type':'application/json'}),body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  return {status:r.status,data};
}

/* ── tiny markdown ───────────────────────────── */
function md(text){
  let o=esc(text);
  o=o.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c.trim()+'</code></pre>');
  o=o.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  o=o.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  o=o.replace(/\[E(\d+)\]/g,'<span class="cite">[E$1]</span>');
  return o;
}
function add(parent,tag,cls,html){
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(html!==undefined)el.innerHTML=html;
  parent.appendChild(el);
  return el;
}

/* ── state pills ─────────────────────────────── */
function setState(kind,text){
  const p=$('pill-state');p.className='pill '+(kind==='online'?'online':kind==='busy'?'busy':'');
  $('state-text').textContent=text;
}
function renderModel(){
  $('model-label').textContent=currentModel?currentModel+' · '+reasoning:'—';
  $('model-text').textContent=currentModel||'—';
  $('pill-model').className='pill '+(currentModel?'online':'');
}
function renderPerms(){
  const p=PRESETS.find(x=>x.id===permissions)||PRESETS[1];
  $('perms-label').textContent=p.label;
  $('perms-text').textContent=p.label;
  $('pill-perms').className='pill online';
}

/* ── workspace + config boot ─────────────────── */
async function loadConfig(){
  const {data}=await api('/config');
  const c=data?.config||{};
  currentModel=c.engine?.model||'';
  reasoning=c.engine?.reasoning_effort||'auto';
  const mode=c.policy?.terminal?.mode||'allowlist';
  permissions=(PRESETS.find(p=>p.mode===mode)||{id:'default'}).id;
  renderModel();renderPerms();
  return c;
}
async function loadWorkspace(){
  const {data}=await api('/workspace');
  const w=data?.workspace||{};
  branch=w.branch||'—';
  $('branch-label').textContent=branch;
  $('branch-mini').textContent=branch==='—'?'':'⑂ '+branch;
  $('ov-cwd').textContent=w.cwd||'';
  renderReview(w);renderActivity(data?.activity||[]);
  return w;
}
function renderReview(w){
  const files=w.changed_files||[];
  const tot=w.totals||{files:0,additions:0,deletions:0};
  $('badge-review').textContent=String(tot.files||0);
  $('badge-files').textContent=String(tot.files||0);
  const rows=files.map(f=>`<div class="frow"><span class="st">${esc(f.status)}</span><span class="p">${esc(f.path)}</span><span class="a">+${f.additions||0}</span><span class="d">−${f.deletions||0}</span></div>`).join('');
  $('ov-review').innerHTML=files.length?rows:'<div class="act">Working tree clean.</div>';
  $('ov-files').innerHTML=files.length
    ? files.map(f=>`<div class="act ok"><div class="t">${esc(f.path)}</div><div class="d">${esc(f.status)} · +${f.additions||0} −${f.deletions||0}</div></div>`).join('')
    : '<div class="act">No changed files.</div>';
}
function renderActivity(list){
  $('badge-terminal').textContent=String(list.length);
  $('ov-terminal').innerHTML=list.length
    ? list.map(a=>`<div class="act ${a.ok?'ok':'bad'}"><div class="t">${esc(a.tool)}${a.evidence?' ['+esc(a.evidence)+']':''}</div><div class="d">${esc((a.detail||'').slice(0,120))}</div></div>`).join('')
    : '<div class="act">No tool steps yet this session.</div>';
}
async function loadSkills(){
  const {data}=await api('/skills');
  const list=data?.skills||[];
  $('badge-skills').textContent=String(list.length);
  $('skill-count').textContent=String(list.length);
  $('ov-skills').innerHTML=list.length
    ? list.slice(0,40).map(s=>`<div class="skill"><b>${esc(s.name)}</b>${s.always?' <span class="tag">always</span>':''}<div class="ds">${esc(s.description||'')}</div></div>`).join('')
    : '<div class="act">No skills installed. Add SKILL.md files under skills/ or .liber/skills/.</div>';
}

/* ── conversation helpers ────────────────────── */
let turns=[];
function ensureStream(){
  const e=$('empty-state'); if(e) e.remove();
}
function newTurn(){
  ensureStream();
  const t=add($('stream'),'div','turn');
  turns.push(t);
  return t;
}
function userMessage(parent,text){
  const row=add(parent,'div','userrow');
  add(row,'div','ububble',esc(text));
  const acts=add(row,'div','uactions');
  const rev=add(acts,'button','tinybtn','revert');
  rev.onclick=()=>doRevert(1);
  const cp=add(acts,'button','tinybtn','copy');
  cp.onclick=()=>navigator.clipboard.writeText(text);
  return row;
}
function step(parent,kind,label,body){
  const d=add(parent,'details','step');
  add(d,'summary','',label);
  add(d,'pre','',body||'');
  stepCount++;
  return d;
}
function answerBlock(parent,text){
  const a=add(parent,'div','answer','');
  a.innerHTML=md(text);
  return a;
}
function audit(parent,g){
  const ok=g.status==='PASS';
  const v=(g.violations||[]);
  const rec=(g.ledger?.receipts||[]).length;
  const el=add(parent,'div','audit'+(ok?'':' warn'),
    ok?`✔ GROUNDING PASS · ${rec} receipt${rec===1?'':'s'} · ${g.claims_checked||0} claim${(g.claims_checked||0)===1?'':'s'} checked`
      :`⚠ GROUNDING — ${v.length} unverified claim${v.length===1?'':'s'}\n`+v.slice(0,4).map(x=>`• [${x.code}] ${x.text}`).join('\n'));
  return el;
}
function filesCard(parent,w){
  const f=(w.changed_files||[]);
  if(!f.length)return;
  const tot=w.totals||{files:0,additions:0,deletions:0};
  const card=add(parent,'div','card');
  const h=add(card,'div','card-h',
    `<b>${tot.files} file${tot.files===1?'':'s'} changed</b> <span class="stat">+${tot.additions} <span class="del">−${tot.deletions}</span></span><span class="grow"></span><button class="tinybtn" id="card-review">Review</button>`);
  const b=add(card,'div','card-b');
  b.innerHTML=f.slice(0,25).map(x=>`<div class="frow"><span class="st">${esc(x.status)}</span><span class="p">${esc(x.path)}</span><span class="a">+${x.additions||0}</span><span class="d">−${x.deletions||0}</span></div>`).join('');
  const btn=h.querySelector('#card-review');
  if(btn) btn.onclick=()=>{openOverview('review');};
}

/* ── streaming turn ──────────────────────────── */
async function runTurn(message){
  const turn=newTurn();
  turnStart=Date.now();stepCount=0;
  const meta=add(turn,'div','worked','working…');
  const stepsWrap=add(turn,'div');
  setState('busy','EXECUTING');
  $('send-btn').disabled=true;

  let answerEl=null,gotFinal=false;
  const onEvent=(name,payload)=>{
    if(name==='thought'){
      step(stepsWrap,'reason','🧠 REASONING · '+(payload.kind||'note'),payload.content||'');
    }else if(name==='tool_dispatch'){
      // observed below; keep the dispatch silent-brief
    }else if(name==='observation'){
      const ok=payload.ok;
      step(stepsWrap,'obs',
        `<span class="tag">[${payload.evidence}]</span> <span class="${ok?'ok':'bad'}">${esc(payload.tool)} ${ok?'OK':'FAILED'}${payload.exit_code?` (exit ${payload.exit_code})`:''}</span>`,
        payload.output||'');
    }else if(name==='loop_guard'){
      step(stepsWrap,'obs','⟳ LOOP GUARD · '+esc(payload.tool||''),'Duplicate/empty action suppressed.');
    }else if(name==='grounding_audit'){
      step(stepsWrap,'obs',`🛠 GROUNDING REPAIR ${payload.attempt||1}/${payload.max_repairs||2}`,'Blocked unverified claims are being corrected.');
    }else if(name==='draft'){
      if(!answerEl){answerEl=add(turn,'div','answer','');}
      answerEl.textContent+=payload.delta||'';
      $('stream').scrollTop=$('stream').scrollHeight;
    }else if(name==='final'){
      gotFinal=true;
      if(answerEl&&answerEl.isConnected)answerEl.remove();
      if(payload.response) answerBlock(turn,payload.response);
      if(payload.grounding) audit(turn,payload.grounding);
    }else if(name==='error'){
      step(stepsWrap,'obs','✖ ERROR',payload.error||'');
    }
  };

  try{
    const res=await fetch(DAEMON+'/chat/stream',{
      method:'POST',
      headers:authHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({agentId:'dev-bot',message})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',ev='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop();
      for(const part of parts){
        for(const line of part.split('\n')){
          if(line.startsWith('event:'))ev=line.slice(6).trim();
          else if(line.startsWith('data:')){
            let p={};try{p=JSON.parse(line.slice(5).trim());}catch{p={content:line.slice(5).trim()};}
            onEvent(ev,p);
          }
        }
      }
    }
  }catch(err){
    step(stepsWrap,'obs','✖ TRANSPORT',String(err.message||err));
  }

  const secs=((Date.now()-turnStart)/1000).toFixed(1);
  meta.textContent=`Worked for ${secs}s · ${stepCount} step${stepCount===1?'':'s'}`;
  meta.onclick=()=>{stepsWrap.style.display=stepsWrap.style.display==='none'?'':'none';};
  stepsWrap.style.display='none';
  setState('online','IDLE');
  $('send-btn').disabled=false;
  loadWorkspace().catch(()=>{});
  $('stream').scrollTop=$('stream').scrollHeight;
}

/* ── slash + actions ─────────────────────────── */
async function handleSlash(raw){
  const [cmd,...rest]=raw.trim().split(/\s+/);
  const arg=rest.join(' ');
  switch(cmd){
    case '/compact':{
      const {data}=await api('/compact','POST',{agentId:'dev-bot',keep:6});
      if(data.success) toast(`compacted ${data.before} → ${data.after} messages (${data.method})`);
      else toast(data.error||'nothing to compact');
      return true;
    }
    case '/revert': await doRevert(1); return true;
    case '/review': openOverview('review'); toast('review panel open'); return true;
    case '/files': openOverview('files'); return true;
    case '/terminal': openOverview('terminal'); return true;
    case '/skills': openOverview('skills'); return true;
    case '/help':
      toast(SLASH.map(s=>s.cmd+' — '+s.desc).join('   |   '));
      return true;
    case '/plan':
      await runTurn('Before acting, write a short numbered plan with the exact files you will touch, then execute it step by step. '+arg);
      return true;
    case '/goal':
      await runTurn('Treat this as a goal that must be verifiably complete. Do not stop until every part is verified with a tool receipt. Goal: '+arg);
      return true;
    default:
      return false;
  }
}
async function doRevert(turns){
  const {data}=await api('/revert','POST',{agentId:'dev-bot',turns});
  toast(data.success?`dropped ${data.dropped} messages · ${data.remaining} left`:(data.error||'revert failed'));
}
function toast(msg){
  let t=$('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--panel3);border:1px solid var(--border-strong);color:var(--text);padding:8px 14px;border-radius:8px;font-size:12px;z-index:500;max-width:70%;box-shadow:0 10px 30px rgba(0,0,0,.5)';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._h);
  t._h=setTimeout(()=>{t.style.opacity='0';},2600);
}

/* ── send ────────────────────────────────────── */
async function send(){
  if(busy)return;
  const box=$('prompt');
  let text=box.value.trim();
  if(!text&&!ctxChips.length)return;

  if(ctxChips.length){
    text=(text?text+'\n\n':'')+'Context files to inspect first:\n'+ctxChips.map(c=>'- '+c).join('\n');
    ctxChips=[];renderChips();
  }
  box.value='';autoGrow();

  if(text.startsWith('/')){
    const handled=await handleSlash(text);
    if(handled)return;
  }

  userMessage(newTurn(),text);
  busy=true;
  await runTurn(text);
  busy=false;
}

/* ── composer plumbing ───────────────────────── */
function autoGrow(){
  const t=$('prompt');
  t.style.height='auto';
  t.style.height=Math.min(t.scrollHeight,180)+'px';
}
function renderChips(){
  $('chips').innerHTML=ctxChips.map((c,i)=>`<span class="chip"><b>@</b>${esc(c)}<span class="x" data-i="${i}">✕</span></span>`).join('');
  $('chips').querySelectorAll('.x').forEach(x=>x.onclick=()=>{ctxChips.splice(+x.dataset.i,1);renderChips();});
}

/* ── popovers ────────────────────────────────── */
function closePops(){document.querySelectorAll('.pop.open').forEach(p=>p.classList.remove('open'));}
function placePop(pop,anchor,align='left'){
  pop.classList.add('open');
  const r=anchor.getBoundingClientRect();
  pop.style.left='0px';pop.style.top='0px';
  const w=pop.offsetWidth,h=pop.offsetHeight;
  let left=align==='right'?r.right-w:r.left;
  left=Math.max(8,Math.min(left,window.innerWidth-w-8));
  let top=r.top-h-8;
  if(top<44)top=r.bottom+8;
  pop.style.left=left+'px';pop.style.top=top+'px';
}

const MENUS={
  file:[
    {label:'New Conversation',act:()=>newConversation()},
    {label:'Compact History',act:()=>handleSlash('/compact')},
    {label:'Revert Last Turn',act:()=>doRevert(1)},
    {label:'Export Session JSON',act:()=>exportSessions()}
  ],
  workspace:[
    {label:'New Conversation  Ctrl+N',act:()=>newConversation()},
    {label:'Refresh Workspace',act:()=>loadWorkspace()},
    {label:'Skills Panel',act:()=>openOverview('skills')}
  ],
  view:[
    {label:'Toggle Sidebar  Ctrl+B',act:()=>toggleSidebar()},
    {label:'Toggle Overview  Ctrl+Alt+O',act:()=>toggleOverview()},
    {label:'Settings  Ctrl+,',act:()=>openDrawer()}
  ],
  window:[
    {label:'Minimize',act:()=>nl('window.minimize')},
    {label:'Maximize',act:()=>nl('window.maximize')},
    {label:'Close',act:()=>nl('window.close')}
  ]
};
async function nl(fn){
  try{ if(window.Neutralino&&Neutralino[fn.split('.')[0]]) await Neutralino[fn.split('.')[0]][fn.split('.')[1]](); }catch{}
}
function bindMenus(){
  document.querySelectorAll('[data-menu]').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const pop=$('pop-menu');
      if(pop.dataset.for===btn.dataset.menu&&pop.classList.contains('open')){closePops();return;}
      pop.dataset.for=btn.dataset.menu;
      pop.innerHTML='';
      for(const item of MENUS[btn.dataset.menu]||[]){
        const d=add(pop,'div','pi',`<span class="nm">${esc(item.label)}</span>`);
        d.onclick=()=>{closePops();item.act();};
      }
      placePop(pop,btn);
    };
  });
}
function openModelPop(anchor){
  const pop=$('pop-model');
  pop.innerHTML='<div class="ph">Model</div>';
  for(const m of CATALOG){
    const d=add(pop,'div','pi'+(m.model===currentModel?' sel':''));
    d.innerHTML=`<div class="r"><span class="nm">${esc(m.label)}</span><span class="tag">${m.provider}</span></div>`;
    d.onclick=()=>{closePops();applyModel(m);};
  }
  add(pop,'div','sep');
  add(pop,'div','ph','Reasoning effort');
  for(const lvl of ['auto','low','medium','high']){
    const d=add(pop,'div','pi'+(lvl===reasoning?' sel':''),`<span class="nm">${lvl[0].toUpperCase()+lvl.slice(1)}</span>`);
    d.onclick=()=>{closePops();applyReasoning(lvl);};
  }
  placePop(pop,anchor,'right');
}
async function applyModel(m){
  const {status,data}=await api('/config','POST',{
    'engine.model':m.model,'engine.provider':m.provider,'engine.endpoint':m.endpoint
  });
  if(status===200&&data.success){
    currentModel=m.model;renderModel();toast('model → '+m.model);
  }else toast('failed: '+(data.error||status));
}
async function applyReasoning(lvl){
  reasoning=lvl;renderModel();
  const {status,data}=await api('/config','POST',{'engine.reasoning_effort':lvl});
  toast(status===200&&data.success?'reasoning → '+lvl:('failed: '+(data.error||status)));
}
function openPermsPop(anchor){
  const pop=$('pop-perms');
  pop.innerHTML='<div class="ph">Agent permissions</div>';
  for(const p of PRESETS){
    const d=add(pop,'div','pi'+(p.id===permissions?' sel':''));
    d.innerHTML=`<div class="r"><span class="nm">${esc(p.label)}</span></div><div class="ds">${esc(p.desc)}</div>`;
    d.onclick=()=>{closePops();applyPreset(p);};
  }
  placePop(pop,anchor,'right');
}
async function applyPreset(p){
  permissions=p.id;renderPerms();
  const {status,data}=await api('/config','POST',{'policy.terminal.mode':p.mode});
  toast(status===200&&data.success?'permissions → '+p.label:('failed: '+(data.error||status)));
}
function openSlashPop(anchor,filter){
  const pop=$('pop-slash');
  const q=(filter||'').toLowerCase();
  const items=SLASH.filter(s=>s.cmd.startsWith(q)||!q);
  if(!items.length){closePops();return;}
  pop.innerHTML='<div class="ph">Actions</div>';
  items.forEach((s,i)=>{
    const d=add(pop,'div','pi'+(i===0?' sel':''));
    d.innerHTML=`<div class="r"><span class="nm">${esc(s.cmd)}</span></div><div class="ds">${esc(s.desc)}</div>`;
    d.onclick=()=>{$('prompt').value='';autoGrow();closePops();handleSlash(s.cmd);};
  });
  placePop(pop,anchor,'left');
}
function openAtPop(anchor){
  const pop=$('pop-at');
  pop.innerHTML='<div class="ph">Add context</div>';
  api('/workspace').then(({data})=>{
    const files=(data?.workspace?.changed_files||[]).map(f=>f.path);
    if(!files.length){
      add(pop,'div','pi','<div class="ds">No changed files to attach. Type a path manually.</div>');
    }else{
      files.slice(0,12).forEach(f=>{
        const d=add(pop,'div','pi',`<span class="nm">${esc(f)}</span>`);
        d.onclick=()=>{closePops();ctxChips.push(f);renderChips();$('prompt').focus();};
      });
    }
    placePop(pop,anchor,'left');
  });
}

function relTime(iso){
  if(!iso)return '';
  const ms=Date.now()-new Date(iso).getTime();
  const m=Math.round(ms/60000);
  if(m<1)return 'now';
  if(m<60)return m+'m';
  const h=Math.round(m/60);
  if(h<24)return h+'h';
  return Math.round(h/24)+'d';
}
async function loadProjects(){
  const {data}=await api('/ps');
  const agents=data?.data||[];
  const {data:sess}=await api('/sessions');
  const sessions=sess?.sessions||{};
  const host=$('project-list');
  host.innerHTML='';
  for(const a of agents){
    const p=add(host,'button','proj',`<span>📁</span> ${esc(a.id)} <span class="grow"></span><span style="font-size:10px;color:var(--dim);font-family:var(--mono)">${esc(a.model||'')}</span>`);
    p.onclick=()=>{};
    const s=sessions[a.id];
    if(s){
      const c=add(host,'button','conv active',`<span class="nm">current session</span><span class="ago">${s.messages} msg</span>`);
      c.onclick=()=>{};
    }
    const c2=add(host,'button','conv',`<span class="nm">＋ new conversation</span>`);
    c2.onclick=()=>newConversation();
  }
  if(!agents.length)host.innerHTML='<div class="skill">No agents connected.</div>';
}
async function exportSessions(){
  const {data}=await api('/sessions');
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='liber-sessions.json';a.click();
  URL.revokeObjectURL(a.href);
}

const NAV=[
  {id:'general',label:'General',icon:'⚙'},
  {id:'model',label:'Models',icon:'🤖',groups:[{id:'main',label:'Main model'},{id:'reasoning',label:'Reasoning'},{id:'limits',label:'Limits'}]},
  {id:'permissions',label:'Permissions',icon:'🛡'},
  {id:'grounding',label:'Grounding',icon:'✔'},
  {id:'appearance',label:'Appearance',icon:'🎨'},
  {id:'memory',label:'Memory & Context',icon:'🧠'},
  {id:'skills',label:'Skills',icon:'◆'},
  {id:'sessions',label:'Sessions',icon:'📜'},
  {id:'shortcuts',label:'Shortcuts',icon:'⌨'},
  {id:'about',label:'About',icon:'ℹ'}
];
let dstate={cat:'general',item:null};
function buildNav(){
  const nav=$('drawer-nav');nav.innerHTML='';
  for(const cat of NAV){
    if(cat.groups){
      const wrap=document.createElement('div');
      wrap.innerHTML=`<div class="dgroup-h"><span>${cat.icon} ${cat.label}</span><span>▾</span></div>`;
      for(const g of cat.groups){
        const it=add(wrap,'div','ditem'+(dstate.cat===cat.id&&dstate.item===g.id?' active':''),g.label);
        it.onclick=()=>{dstate={cat:cat.id,item:g.id};buildNav();renderPanel();};
      }
      nav.appendChild(wrap);
    }else{
      const it=add(nav,'div','ditem'+(dstate.cat===cat.id?' active':''),`${cat.icon} ${cat.label}`);
      it.onclick=()=>{dstate={cat:cat.id,item:null};buildNav();renderPanel();};
    }
  }
}
function crumb(){
  const cat=NAV.find(c=>c.id===dstate.cat);
  const g=cat?.groups?.find(x=>x.id===dstate.item);
  $('drawer-crumb').innerHTML='<span>Settings</span>'+(cat?` <span class="sep">›</span> ${esc(cat.label)}`:'')+(g?` <span class="sep">›</span> <b>${esc(g.label)}</b>`:'');
}
function f(label,input,hint){
  const d=document.createElement('div');d.className='f';
  d.innerHTML=`<label>${label}</label><div class="c">${input}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
  return d;
}

    save.onclick=async()=>{

    p.innerHTML='<h3>Skills</h3><div class="pd">Procedural knowledge loaded by progressive disclosure.</div>';

  // general
  p.innerHTML='<h3>General</h3><div class="pd">Agent execution, permissions, and grounded truthfulness.</div>';
  p.appendChild(f('Permission preset',`<select id="gn-perm">${PRESETS.map(x=>`<option value="${x.id}">${x.label}</option>`).join('')}</select>`,'Maps to the terminal policy mode.'));
  p.appendChild(f('Plan review',`<select id="gn-plan"><option value="off">Off</option><option value="ask">Always ask</option></select>`,'/plan forces a plan; "always ask" is a UI hint only in this build.'));
  p.appendChild(f('Queued messages',`<select id="gn-queue"><option value="queue">Queue</option><option value="send">Send immediately</option></select>`,'Turns are serialized per agent by the daemon.'));
  p.querySelector('#gn-perm').value=permissions;
  const row=document.createElement('div');row.className='brow';
  const b=document.createElement('button');b.className='btn primary';b.textContent='Apply';
  b.onclick=async()=>{
    const pr=PRESETS.find(x=>x.id===p.querySelector('#gn-perm').value);
    await applyPreset(pr);
    toast('general settings applied');
  };
  row.appendChild(b);p.appendChild(row);
}

  $('drawer-overlay').classList.add('open');

}
function closeDrawer(){$('drawer-overlay').classList.remove('open');}
function applyAccent(col){
  document.documentElement.style.setProperty('--accent',col);
  try{localStorage.setItem('liber-accent',col);}catch{}
  document.querySelectorAll('.sw').forEach(s=>{
    s.classList.toggle('sel',(s.dataset.color||'').toLowerCase()===String(col).toLowerCase());
  });
}

/* ── events ──────────────────────────────────── */
$('send-btn').onclick=send;
$('prompt').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  if(e.key==='Tab'){ // quick accept of slash suggestion
    const t=$('prompt');
    if(t.value.startsWith('/')){
      e.preventDefault();
      const hit=SLASH.find(s=>s.cmd.startsWith(t.value.trim()));
      if(hit){t.value=hit.cmd+' ';}
    }
  }
});
$('prompt').addEventListener('input',e=>{
  autoGrow();
  const v=$('prompt').value;
  if(v.startsWith('/')&&!v.includes(' ')) openSlashPop($('prompt'),v.trim());
  else if(v.endsWith('@')) openAtPop($('prompt'));
  else closePops();
});
$('btn-model').onclick=e=>{e.stopPropagation();openModelPop($('btn-model'));};
$('btn-perms').onclick=e=>{e.stopPropagation();openPermsPop($('btn-perms'));};
$('btn-context').onclick=e=>{e.stopPropagation();openAtPop($('btn-context'));};

$('drawer-close').onclick=closeDrawer;
$('drawer-overlay').onclick=e=>{if(e.target===$('drawer-overlay'))closeDrawer();};
$('drawer-search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('#drawer-nav .ditem').forEach(el=>{
    const hit=!q||el.textContent.toLowerCase().includes(q);
    el.style.display=hit?'':'none';
  });
});

$('btn-compact').onclick=()=>handleSlash('/compact');
$('btn-review').onclick=()=>openOverview('review');
document.querySelectorAll('.ovrow').forEach(r=>r.onclick=()=>openOverview(r.dataset.ov));
document.addEventListener('click',e=>{
  if(!e.target.closest('.pop')&&!e.target.closest('[data-menu]')&&!['btn-model','btn-perms','btn-context'].includes(e.target.id))closePops();
});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.ctrlKey&&k==='b'){e.preventDefault();toggleSidebar();}
  if(e.ctrlKey&&e.altKey&&k==='o'){e.preventDefault();toggleOverview();}
  if(e.ctrlKey&&k===','){e.preventDefault();openDrawer();}
  if(e.ctrlKey&&k==='k'){e.preventDefault();openDrawer();}
  if(e.ctrlKey&&k==='/'){e.preventDefault();openModelPop($('btn-model'));}
  if(e.ctrlKey&&k==='n'){e.preventDefault();newConversation();}
  if(e.key==='Escape'){closePops();closeDrawer();}
});

function buildNav(){
  const nav=$('drawer-nav');nav.innerHTML='';
  for(const cat of NAV2){
    if(cat.groups){
      const wrap=document.createElement('div');
      wrap.innerHTML=`<div class="dgroup-h"><span>${cat.icon} ${esc(cat.label)}</span><span>▾</span></div>`;
      for(const g of cat.groups){
        const it=add(wrap,'div','ditem'+(ds.cat===cat.id&&ds.item===g.id?' active':''),g.label);
        it.onclick=()=>{ds={cat:cat.id,item:g.id};buildNav();renderPanel();};
      }
      nav.appendChild(wrap);
    }else{
      const it=add(nav,'div','ditem'+(ds.cat===cat.id&&!ds.item?' active':''),`${cat.icon} ${cat.label}`);
      it.onclick=()=>{ds={cat:cat.id,item:null};buildNav();renderPanel();};
    }
  }
  const foot=document.createElement('div');
  foot.style.cssText='padding:10px 8px 4px;border-top:1px solid var(--border);margin-top:8px;display:flex;flex-direction:column;gap:6px';
  foot.innerHTML=`<button class="btn" id="cfg-export" style="width:100%;text-align:left">↧ Export config</button>
    <button class="btn" id="cfg-import" style="width:100%;text-align:left" disabled title="Not implemented in this build">↥ Import config</button>
    <button class="btn" id="cfg-reset" style="width:100%;text-align:left">⟲ Reset to defaults</button>`;
  nav.appendChild(foot);
  foot.querySelector('#cfg-export').onclick=exportConfig;
  foot.querySelector('#cfg-reset').onclick=resetConfig;
}

function crumb(){
  const cat=NAV2.find(c=>c.id===ds.cat);
  const g=cat?.groups?.find(x=>x.id===ds.item);
  $('drawer-crumb').innerHTML='<span>Settings</span>'+(cat?` <span class="sep">›</span> <span>${esc(cat.label)}</span>`:'')+(g?` <span class="sep">›</span> <b>${esc(g.label)}</b>`:'');
}

function unavailable(title,what){
  return `<h3>${esc(title)}</h3><div class="pd">${esc(what)}</div>
  <div class="card"><div class="card-h">Not available in this build</div>
  <div class="card-b" style="padding:10px 11px;font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.6">
  The daemon exposes no backend for this panel, so it is shown read-only instead of pretending to save settings. Everything else in this drawer applies live to <code>liber.yaml</code>.
  </div></div>`;
}

async function exportConfig(){
  const {data}=await api('/config/export');
  if(!data.success){toast('export failed');return;}
  const blob=new Blob([data.yaml],{type:'text/yaml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='liber.yaml';a.click();
  URL.revokeObjectURL(a.href);
  toast('exported liber.yaml (credentials redacted)');
}
async function resetConfig(){
  if(!confirm('Reset every setting in this drawer to the shipped defaults? Model/provider/endpoint are kept.'))return;
  const {status,data}=await api('/config/reset','POST',{});
  if(status===200&&data.success){
    toast('reset '+data.reset.length+' keys to defaults');
    await loadConfig();renderPanel();
  }else toast('reset failed: '+(data.error||status));
}

  const apply=async(payload,label)=>{
    const r=await api('/config','POST',payload);

      <tr><td><b>openai</b> ${e.provider==='openai'?'<span style="color:var(--green)">● active</span>':''}</td><td>openai-adapter</td><td>any OpenAI-compatible /v1</td></tr>
      <tr><td><b>anthropic</b> ${e.provider==='anthropic'?'<span style="color:var(--green)">● active</span>':''}</td><td>anthropic-adapter</td><td>api.anthropic.com</td></tr>
      <tr><td><b>gemini</b> ${e.provider==='gemini'?'<span style="color:var(--green)">● active</span>':''}</td><td>gemini-adapter</td><td>generativelanguage.googleapis.com</td></tr>
      <tr><td><b>ollama</b> ${e.provider==='ollama'?'<span style="color:var(--green)">● active</span>':''}</td><td>ollama-adapter</td><td>/api/chat</td></tr>
      </tbody></table>
      <div class="dsec">Credentials</div>
      <div class="f"><label>Key source</label><div class="c"><input type="text" value="OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY in .env" disabled style="opacity:.7"><div class="hint">Keys are never shown or written by this UI.</div></div></div>`;
    return;
  }

  /* ── KEYBINDS ──────────────────────────── */
  if(cat==='keybinds'){
    const sc=[['Enter','Send message'],['Shift+Enter','New line'],['Ctrl+N','New conversation'],
      ['Ctrl+/','Model selector'],['Ctrl+B','Toggle sidebar'],['Ctrl+Alt+O','Toggle overview rail'],
      ['Ctrl+, / Ctrl+K','Open settings'],['Tab','Accept slash command'],['Esc','Close popover or drawer']];
    p.innerHTML=`<h3>Keyboard Shortcuts</h3><div class="pd">Bound in this build. Rebinding needs a shortcut layer the shell does not have.</div>
      <table class="tbl"><thead><tr><th>Key</th><th>Action</th></tr></thead><tbody>
      ${sc.map(([k,d])=>`<tr><td style="font-family:var(--mono);color:var(--accent)">${esc(k)}</td><td>${esc(d)}</td></tr>`).join('')}
      </tbody></table>`;
    return;
  }

  /* ── TOOLS & KEYS ──────────────────────── */
  if(cat==='apikeys'){
    p.innerHTML=`<h3>Tools &amp; Keys</h3><div class="pd">What the agent may execute, and where keys come from.</div>
      <div class="dsec">Tools</div>
      <table class="tbl"><thead><tr><th>Tool</th><th>State</th></tr></thead><tbody>
      ${[['read_file','on'],['search_files','on'],['write_file','policy-gated'],['patch','policy-gated'],['terminal','policy-gated'],['fetch_url','on'],['web_search','on'],['task / tasks','on (depth 1)'],['memory','on'],['skill','on'],['todo_list','on']]
        .map(([n,s])=>`<tr><td>${esc(n)}</td><td style="color:${s==='on'?'var(--green)':'var(--amber)'}">${esc(s)}</td></tr>`).join('')}
      </tbody></table>
      <div class="dsec">API keys</div>
      <div class="f"><label>OpenAI-compatible</label><div class="c"><input type="text" value="from .env: OPENAI_API_KEY" disabled style="opacity:.7"></div></div>
      <div class="f"><label>Anthropic</label><div class="c"><input type="text" value="from .env: ANTHROPIC_API_KEY" disabled style="opacity:.7"></div></div>
      <div class="f"><label>Google</label><div class="c"><input type="text" value="from .env: GEMINI_API_KEY" disabled style="opacity:.7"></div></div>
      <div class="f"><label>MCP servers</label><div class="c"><input type="text" value="not supported in this build" disabled style="opacity:.7"></div></div>`;
    return;
  }

  /* ── SESSIONS ──────────────────────────── */
  if(cat==='sessions'){
    const se=(await api('/sessions')).data||{};
    const sessions=se.sessions||{};
    p.innerHTML=`<h3>Sessions</h3><div class="pd">Live conversation state and its persisted copy.</div>
      <table class="tbl"><thead><tr><th>Agent</th><th>Messages</th><th>Last</th></tr></thead><tbody>
      ${Object.keys(sessions).length?Object.entries(sessions).map(([id,s])=>`<tr><td>${esc(id)}</td><td>${s.messages}</td><td style="color:var(--dim)">${esc((s.last||'').slice(0,70))}</td></tr>`).join(''):'<tr><td colspan="3">No sessions.</td></tr>'}
      </tbody></table>
      ${se.persisted?`<div class="pd" style="margin-top:10px">Persisted: <span style="font-family:var(--mono)">${esc(se.persisted.file)}</span> (${se.persisted.size_bytes} bytes)</div>`:''}
      <div class="dsec">Archive &amp; retention</div>
      <div class="f"><label>Archive</label><div class="c"><input type="text" value="not implemented — clear or export instead" disabled style="opacity:.7"></div></div>
      <div class="brow"><button class="btn" id="ss-export">Export JSON</button><button class="btn" id="ss-clear">Clear all</button></div>`;
    p.querySelector('#ss-export').onclick=exportSessions;
    p.querySelector('#ss-clear').onclick=async()=>{if(!confirm('Clear all sessions?'))return;await api('/sessions','DELETE');renderPanel();};
    return;
  }

  /* ── ABOUT ─────────────────────────────── */
  if(cat==='about'){
    const who=(await api('/whoami')).data||{};
    p.innerHTML=`<h3>About LiBER</h3><div class="pd">Autonomous agent orchestrator with machine-enforced grounding.</div>
      <table class="tbl"><tbody>
      <tr><td style="width:150px">App</td><td>0.5.0 · Neutralino / WebView2</td></tr>
      <tr><td>Daemon</td><td style="font-family:var(--mono)">${esc(who.cwd||'')}</td></tr>
      <tr><td>Node</td><td>${esc(who.version||'')}</td></tr>
      <tr><td>Platform</td><td>${esc(who.platform||'')} / ${esc(who.arch||'')} · ${who.cpus||'?'} cpus</td></tr>
      <tr><td>Model</td><td>${esc(e.model||'')} (${esc(e.provider||'')})</td></tr>
      <tr><td>License</td><td>MIT</td></tr>
      </tbody></table>
      <div class="dsec">Version &amp; updates</div>
      <div class="brow" style="border-top:none;padding-top:0"><button class="btn" id="ab-check">Check daemon</button></div>`;
    p.querySelector('#ab-check').onclick=async()=>{
      const r=await api('/healthz');
      toast(r.status===200?'daemon healthy':'daemon unreachable');
    };
    return;
  }

  /* ── HONEST STUBS ──────────────────────── */
  const STUBS={
    browser:['Browser','A built-in browser and browser subagent do not exist in this daemon; fetch_url and web_search are the only network tools.'],
    vault:['Passwords &amp; Logins','There is no credential vault here. Provider keys come from .env and are never read back by the agent.'],
    voice:['Voice','No speech-to-text or text-to-speech pipeline is wired into LiBER.'],
    notifications:['Notifications','The daemon emits no desktop notifications; turn results are only visible in this window.'],
    billing:['Billing','LiBER runs on your own API keys. There is no metering, credit balance or plan — limits are enforced locally in the Advanced page.'],
    gateways:['Gateways','Remote gateway connections are not part of this build; the daemon listens on loopback only.']
  };
  if(STUBS[cat]){ p.innerHTML=unavailable(STUBS[cat][0],STUBS[cat][1]); return; }

  p.innerHTML=unavailable('Settings','Unknown page.');
}

/* UI preferences (local, not daemon config) */
function uiPrefs(){
  let raw={};
  try{raw=JSON.parse(localStorage.getItem('liber-ui')||'{}');}catch{}
  return {toolDisplay:'product',collapseThinking:false,hideDiffs:false,hideTimeline:false,scale:1,chatFont:'',density:'comfortable',...raw};
}
function setUiPrefs(patch){
  const next={...uiPrefs(),...patch};
  try{localStorage.setItem('liber-ui',JSON.stringify(next));}catch{}
  return next;
}
function applyUiPrefs(){
  const p=uiPrefs();
  document.documentElement.style.fontSize=(14*p.scale)+'px';
  if(p.chatFont){document.body.style.fontFamily=p.chatFont;}
  else{document.body.style.fontFamily='';}
  document.body.dataset.density=p.density;
  document.body.dataset.tools=p.toolDisplay;
  document.querySelectorAll('#nav-prev,#nav-next').forEach(el=>{el.style.display=p.hideTimeline?'none':'';});
}

/* ── boot ────────────────────────────────────── */
(async()=>{
  await loadToken();
  try{
    const {status}=await api('/healthz');
    setState(status===200?'online':'',status===200?'IDLE':'OFFLINE');
  }catch{setState('','OFFLINE');}
  await loadConfig().catch(()=>{});
  await loadWorkspace().catch(()=>{});
  await loadSkills().catch(()=>{});
  await loadProjects().catch(()=>{});
  bindMenus();
  applyAccent(localStorage.getItem('liber-accent')||ACCENTS[0]);
  applyUiPrefs();
  openOverview('review');
  setInterval(()=>{loadWorkspace().catch(()=>{});},20000);
  $('prompt').focus();
})();
</script>
</body>
</html>
